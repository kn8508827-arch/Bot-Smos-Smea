<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ICOM — Team ស្មោះស្នេហ៍</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Same look as the Lovable ICOM: navy night, glass cards, sky + gold gradients */
:root{--bg:#0b1846;--fg:#f4f8ff;--glass:rgba(22,40,104,.55);--border:rgba(150,200,255,.28);--muted:#c3d3ea;
  --primary:#3fb0f0;--sky:linear-gradient(135deg,#3fb0f0,#2f5fd8);--gold:#f3cf6a;--gold-grad:linear-gradient(135deg,#f7dc84,#e9ad3b);
  --gold-fg:#3a2a08;--red:#f0503f;--ok:#3ed68a;--glow:0 10px 40px -10px rgba(63,176,240,.55);--r:1rem}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Kantumruy Pro",system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{min-height:100vh;padding-bottom:calc(210px + env(safe-area-inset-bottom))}
.disp{font-family:Outfit,"Kantumruy Pro",sans-serif}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--border);box-shadow:var(--glow);border-radius:calc(var(--r)*1.25)}
header{position:relative;height:176px;overflow:hidden}
header img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% center}
header::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,24,70,.15),rgba(11,24,70,.55) 55%,var(--bg))}
header .top{position:absolute;z-index:1;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:rgba(11,24,70,.55);color:var(--fg);border-radius:99px;padding:7px 12px;font-family:inherit;font-weight:600;font-size:12.5px}
.live{background:var(--red);border-color:transparent;font-weight:700;box-shadow:0 0 12px rgba(240,80,63,.6)}
header .ttl{position:absolute;z-index:1;left:16px;right:16px;bottom:14px}
header h1{margin:0;font-size:22px;font-weight:800;line-height:1.2;text-shadow:0 2px 12px rgba(0,0,0,.5)}
header p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
main{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px}
.tabs button{border:0;border-radius:calc(var(--r)*.8);padding:11px;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:14px}
.tabs button.on{background:var(--sky);color:#06173d;box-shadow:var(--glow)}
.status{display:flex;align-items:center;gap:12px;padding:14px}
.status .dot{width:42px;height:42px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.08)}
.status.on .dot{background:rgba(62,214,138,.18);box-shadow:0 0 0 3px rgba(62,214,138,.25)}
.status .tx{flex:1;min-width:0} .status b{display:block;font-size:15px} .status small{color:var(--muted);font-size:12.5px}
.btn{border:0;border-radius:99px;padding:9px 16px;font-family:inherit;font-weight:700;font-size:12.5px;white-space:nowrap}
.btn.sky{background:var(--sky);color:#06173d} .btn.gold{background:var(--gold-grad);color:var(--gold-fg)}
.btn.line{background:transparent;border:1px solid var(--border);color:var(--fg)}
.btn:disabled{opacity:.6}
#alert{display:none;padding:12px 14px;border-radius:var(--r);background:rgba(240,80,63,.15);border:1px solid rgba(240,80,63,.5);font-size:13.5px;line-height:1.6}
.card{padding:14px}
.card h2{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h2 .n{margin-left:auto;font:700 12px Outfit,sans-serif;color:var(--gold-fg);background:var(--gold-grad);border-radius:99px;padding:3px 9px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);background:rgba(255,255,255,.04);border:1px solid transparent;transition:.15s}
li.talk{border-color:var(--gold);background:rgba(243,207,106,.1);box-shadow:0 0 18px rgba(243,207,106,.25)}
li .no{width:20px;text-align:center;font:700 12px Outfit,sans-serif;color:var(--muted)}
.av{position:relative;width:40px;height:40px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font:800 16px Outfit,sans-serif;color:#06173d;background:var(--sky);background-size:cover;background-position:center}
.av .o{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:#6b7896}
.av .o.on{background:var(--ok)}
li .nm{flex:1;min-width:0} li .nm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .nm small{font-size:11.5px;color:var(--muted)} li .nm small.on{color:var(--ok)} li .nm small.air{color:var(--gold)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 4px}
#search{width:100%;margin:0 0 10px;padding:11px 14px;border-radius:var(--r);border:1px solid var(--border);background:rgba(0,0,0,.2);color:var(--fg);font-family:inherit;font-size:14px;outline:none;-webkit-user-select:text;user-select:text}
.duo{display:flex;align-items:center;justify-content:center;gap:18px;padding:8px 0 4px}
.duo .av{width:72px;height:72px;font-size:26px} .duo .wave{font-size:22px;letter-spacing:4px;color:var(--gold)}
.duo-t{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(11,24,70,0));display:flex;flex-direction:column;align-items:center;gap:8px}
#speak{min-height:20px;font-size:13px;color:var(--gold);font-weight:600;text-align:center}
#talk{position:relative;width:132px;height:132px;border-radius:50%;border:3px solid transparent;background:var(--sky);color:#06173d;
  font-family:inherit;font-weight:800;font-size:13px;line-height:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:var(--glow);transition:transform .12s;touch-action:manipulation}
#talk .ic{font-size:40px;line-height:1}
#talk:active{transform:scale(.96)}
#talk:disabled{filter:grayscale(.7) brightness(.7)}
#talk.on{background:var(--red);color:#fff;border-color:var(--gold);transform:scale(1.02);box-shadow:0 0 0 8px rgba(240,80,63,.18),0 0 50px rgba(240,80,63,.6)}
#talk.on::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid var(--gold);animation:p 1.4s ease-out infinite}
@keyframes p{from{transform:scale(.95);opacity:1}to{transform:scale(1.25);opacity:0}}
.spin{display:inline-block;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
#ring{position:fixed;z-index:9;left:16px;right:16px;top:max(16px,env(safe-area-inset-top));display:none;align-items:center;gap:12px;padding:12px;
  border-radius:calc(var(--r)*1.25);background:var(--gold-grad);color:var(--gold-fg);box-shadow:0 12px 40px rgba(0,0,0,.45);animation:in .25s ease-out}
@keyframes in{from{transform:translateY(-20px);opacity:0}}
#ring .tx{flex:1;font-size:13.5px;line-height:1.4} #ring .btn{padding:9px 13px}
#tapsound{display:none;position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.55);align-items:center;justify-content:center;text-align:center;padding:24px;font-size:16px;font-weight:700}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#talk.on::after,.spin{animation:none}}
</style>
</head>
<body>
<header>
  <img src="https://team-smos-snea.lovable.app/assets/icom-angkor-banner-H4QpfUqr.jpg" alt="" width="1536" height="640" onerror="this.remove()">
  <div class="top"><button class="chip" id="back" type="button">← Hub</button><span class="chip live" id="liveChip" hidden>● LIVE</span></div>
  <div class="ttl"><h1 class="disp" id="title">Team ស្មោះស្នេហ៍ ICOM</h1><p id="sub">សម្រាប់សមាជិកដែលបានអនុម័ត · ចុចហើយនិយាយភ្លាម</p></div>
</header>

<main>
  <div class="tabs glass" id="tabs">
    <button type="button" data-tab="group" class="on">👥 Group</button>
    <button type="button" data-tab="members">👤 សមាជិក</button>
  </div>

  <section class="status glass" id="status">
    <div class="dot" id="stDot">📡</div>
    <div class="tx"><b id="stTitle">Voice Off</b><small id="stSub">កំពុងរៀបចំ…</small></div>
    <button class="btn sky" id="joinBtn" type="button" hidden>Join Voice</button>
  </section>

  <div id="alert" role="alert"></div>

  <section class="card glass" id="pGroup">
    <h2>📡 Channel Ready <span class="n" id="count">0</span></h2>
    <ul id="roster"><li class="empty">មិនទាន់មាននរណាម្នាក់ក្នុងបន្ទប់ទេ</li></ul>
  </section>

  <section class="card glass" id="pMembers" hidden>
    <h2>👤 សមាជិក Team <span class="n" id="mcount">0</span></h2>
    <input id="search" type="search" placeholder="🔎 ស្វែងរកឈ្មោះ…" autocomplete="off">
    <ul id="mlist"><li class="empty">កំពុងផ្ទុក…</li></ul>
  </section>

  <section class="card glass" id="pPrivate" hidden>
    <h2>📻 Private ICOM</h2>
    <div class="duo"><div class="av" id="meAv"></div><span class="wave">· · ·</span><div class="av" id="peerAv"></div></div>
    <div class="duo-t" id="duoT"></div>
    <div style="display:flex;justify-content:center;margin-top:12px"><button class="btn line" id="toGroup" type="button">👥 ត្រឡប់ទៅ Group</button></div>
  </section>
</main>

<div class="dock">
  <div id="speak"></div>
  <button id="talk" type="button" disabled><span class="ic" id="talkIc">🎙️</span><span id="talkTx">JOIN VOICE FIRST</span></button>
</div>

<div id="ring"><div class="tx" id="ringTx"></div><button class="btn sky" id="ringYes" type="button">ចូល</button><button class="btn line" id="ringNo" type="button" style="color:var(--gold-fg);border-color:var(--gold-fg)">✕</button></div>
<div id="tapsound">🔊 ចុចកន្លែងណាក៏បាន ដើម្បីបើកសំឡេង</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const tg = window.Telegram && Telegram.WebApp;
const LK = window.LivekitClient;
const S = { room: null, mic: null, talking: false, mode: "group", peer: null, peerName: "", me: null, myName: "", myPhoto: "",
  members: [], tab: "group", busy: false, gen: 0, ringFrom: null };

if (tg) { tg.ready(); tg.expand();
  try { tg.setHeaderColor("#0b1846"); tg.setBackgroundColor("#0b1846"); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }

// Telegram's signed initData: from Telegram itself, or passed by the Hub in the hash (#tg=...)
const INIT = (() => { if (tg && tg.initData) return tg.initData;
  const m = location.hash.match(/[#&]tg=([^&]+)/); return m ? decodeURIComponent(m[1]) : ""; })();
const QS = new URLSearchParams(location.search);
const WITH = +(QS.get("with") || 0);
// API: same server when served by the bot; from the Hub site (GitHub Pages) call the bot's Railway server
const API = (QS.get("api") || (location.hostname.endsWith("github.io") ? "https://bot-smos-smea-production.up.railway.app" : "")).replace(/\/$/, "");

const haptic = s => { try { tg && tg.HapticFeedback.impactOccurred(s); } catch (e) {} };
const esc = s => String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const idOf = p => +String(p.identity || "").replace(/^tg/, "") || 0;
const photoOf = p => { try { return JSON.parse(p.metadata || "{}").p || ""; } catch (e) { return ""; } };
function av(name, photo, online) {
  const st = photo ? ` style="background-image:url('${esc(photo)}')"` : "";
  const dot = online === undefined ? "" : `<span class="o${online ? " on" : ""}"></span>`;
  return `<div class="av"${st}>${photo ? "" : esc((name || "?").trim().charAt(0).toUpperCase())}${dot}</div>`;
}
function alertMsg(html) { const a = $("alert"); a.innerHTML = html || ""; a.style.display = html ? "block" : "none"; }

async function api(path, extra) {
  const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ initData: INIT }, extra || {})) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, j };
}
const ERR = {
  open_from_telegram: "សូមបើក ICOM ពីក្នុង <b>Cooler Hub</b> នៅ Telegram 🙏",
  members_only: "🎟️ ICOM សម្រាប់តែសមាជិកដែលបានបង់ប្រាក់ និង Owner អនុម័តហើយ។ ផ្ញើ <b>/pay</b> ទៅ Bot ($1 / ខែ) រួចចូលម្ដងទៀត 💙",
  not_configured: "⚙️ ICOM មិនទាន់ភ្ជាប់ LiveKit ទេ (Admin ដាក់ LIVEKIT_* ក្នុង Railway Variables)",
  not_member: "សមាជិកនេះមិនទាន់ជាសមាជិកសកម្មទេ", wait: "⏳ ទើបតែហៅ — រង់ចាំបន្តិចសិន",
};

// ---------- status UI (same states as the Lovable ICOM) ----------
function ui(state) {          // state: off | connecting | reconnecting | on
  S.state = state;
  const on = state === "on", priv = S.mode === "private";
  $("status").classList.toggle("on", on);
  $("stDot").innerHTML = on ? "🟢" : (state === "off" ? "📡" : '<span class="spin">⏳</span>');
  $("stTitle").textContent = on ? "Voice Connected" : state === "off" ? "Voice Off" : state === "connecting" ? "Connecting…" : "Reconnecting…";
  $("stSub").textContent = on ? (priv ? "អ្នកកំពុងនៅក្នុង Private ICOM ជាមួយ " + S.peerName : "អ្នកកំពុងនៅក្នុង Team voice channel")
    : state === "off" ? "ចុច Join ដើម្បីស្ដាប់ និងនិយាយ" : "សូមរង់ចាំបន្តិច…";
  $("joinBtn").hidden = state === "connecting" || state === "reconnecting";
  $("joinBtn").textContent = on ? "Leave Voice" : "Join Voice";
  $("joinBtn").className = "btn " + (on ? "line" : "sky");
  $("liveChip").hidden = !on;
  $("title").textContent = priv ? "Private ICOM" : "Team ស្មោះស្នេហ៍ ICOM";
  $("sub").textContent = priv ? "📻 " + S.peerName + " · និយាយតែពីរនាក់" : "សម្រាប់សមាជិកដែលបានអនុម័ត · ចុចហើយនិយាយភ្លាម";
  $("tabs").hidden = priv; $("pPrivate").hidden = !priv;
  $("pGroup").hidden = priv || S.tab !== "group"; $("pMembers").hidden = priv || S.tab !== "members";
  talkUI();
}
function talkUI() {
  const t = $("talk"), on = S.state === "on";
  t.disabled = !on; t.classList.toggle("on", on && S.talking);
  $("talkIc").innerHTML = !on ? (S.state === "off" ? "🎙️" : '<span class="spin">⏳</span>') : S.talking ? "🔴" : "🎙️";
  $("talkTx").textContent = !on ? (S.state === "off" ? "JOIN VOICE FIRST" : "Connecting…") : S.talking ? "កំពុងនិយាយ… ចុចដើម្បីឈប់" : "ចុចដើម្បីនិយាយ";
}

function participants() { return S.room ? [S.room.localParticipant, ...S.room.remoteParticipants.values()] : []; }
function onlineIds() { return new Set(S.mode === "group" ? participants().map(idOf) : []); }

function render() {
  const all = participants();
  const me = S.room && S.room.localParticipant;
  // speaking line
  const talkers = all.filter(p => p !== me && p.isSpeaking).map(p => p.name || "Member");
  $("speak").textContent = S.talking ? "🔴 អ្នកកំពុងនិយាយ…" + (talkers.length ? " · 🔊 " + talkers.join(", ") : "")
    : talkers.length ? "🔊 " + talkers.join(", ") + " កំពុងនិយាយ" : "";
  if (S.mode === "private") {
    const peer = all.find(p => idOf(p) === S.peer);
    $("meAv").outerHTML = av(S.myName, S.myPhoto).replace('class="av"', 'class="av" id="meAv"');
    const pm = S.members.find(m => m.id === S.peer) || {};
    $("peerAv").outerHTML = av(S.peerName, (peer && photoOf(peer)) || pm.photo, !!peer).replace('class="av"', 'class="av" id="peerAv"');
    $("duoT").textContent = S.state !== "on" ? "" : peer ? (peer.isSpeaking ? "🔊 " + S.peerName + " កំពុងនិយាយ" : "✅ " + S.peerName + " នៅក្នុងខ្សែ")
      : "⏳ កំពុងរង់ចាំ " + S.peerName + " ចូល… (បានហៅទៅហើយ 📻)";
    return;
  }
  const sorted = [...all].sort((a, b) => (b.isSpeaking - a.isSpeaking) || ((b === me) - (a === me)));
  $("count").textContent = all.length;
  $("roster").innerHTML = !S.room ? '<li class="empty">មិនទាន់ចូល Voice</li>' : sorted.map((p, i) => {
    const air = p.isMicrophoneEnabled;
    return `<li class="${p.isSpeaking ? "talk" : ""}"><span class="no">${i + 1}</span>${av(p.name, photoOf(p), true)}
      <div class="nm"><b>${esc(p.name || "Member")}${p === me ? " (ខ្ញុំ)" : ""}</b>
      <small class="${p.isSpeaking ? "air" : air ? "air" : "on"}">${p.isSpeaking ? "🔊 កំពុងនិយាយ" : air ? "🎙️ On air" : "● Online"}</small></div></li>`;
  }).join("") || '<li class="empty">មិនទាន់មាននរណាម្នាក់ក្នុងបន្ទប់ទេ</li>';
  renderMembers();
}
function renderMembers() {
  const on = onlineIds(), q = ($("search").value || "").trim().toLowerCase();
  const list = S.members.filter(m => m.id !== S.me && (!q || m.name.toLowerCase().includes(q)))
    .sort((a, b) => (on.has(b.id) - on.has(a.id)) || (b.seen - a.seen));
  $("mcount").textContent = S.members.length;
  $("mlist").innerHTML = list.map(m => `<li data-id="${m.id}">${av(m.name, m.photo, on.has(m.id))}
    <div class="nm"><b>${esc(m.name)}${m.staff ? " ⭐" : ""}</b><small class="${on.has(m.id) ? "on" : ""}">${on.has(m.id) ? "● Online" : "Offline"}</small></div>
    <button class="btn gold" type="button" data-call="${m.id}">📻 ហៅ</button></li>`).join("")
    || `<li class="empty">${S.members.length ? "រកមិនឃើញ" : "មិនទាន់មានសមាជិកផ្សេងទៀតទេ"}</li>`;
}

// ---------- voice ----------
function blip(up) { try { const c = blip.c = blip.c || new (window.AudioContext || window.webkitAudioContext)();
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
  o.frequency.setValueAtTime(up ? 880 : 1200, t); o.frequency.linearRampToValueAtTime(up ? 1250 : 700, t + .08);
  g.gain.setValueAtTime(.1, t); g.gain.exponentialRampToValueAtTime(.001, t + .1); o.connect(g).connect(c.destination); o.start(t); o.stop(t + .11); } catch (e) {} }

async function ensureMic() {   // open the mic once and publish it muted, so a tap talks instantly
  if (S.mic || !S.room) return S.mic;
  const track = await LK.createLocalAudioTrack({ echoCancellation: true, noiseSuppression: true, autoGainControl: true });
  await S.room.localParticipant.publishTrack(track, { source: LK.Track.Source.Microphone, dtx: true, red: true });
  await track.mute();
  S.mic = track; return track;
}
async function setTalk(on) {
  if (!S.room) return;
  try {
    const mic = await ensureMic();
    on ? await mic.unmute() : await mic.mute();
    S.talking = on; blip(on); haptic(on ? "heavy" : "light"); alertMsg("");
  } catch (e) {
    S.talking = false; S.mic = null;
    alertMsg("🎤 មិនអាចប្រើ Microphone បានទេ — អនុញ្ញាត Microphone ឱ្យ Telegram ក្នុង Settings ទូរសព្ទ រួចចុចម្ដងទៀត");
  }
  talkUI(); render();
}

async function connect(peer) {
  if (!LK) { ui("off"); return alertMsg("មិនអាចផ្ទុក Voice បានទេ — ពិនិត្យ Internet ហើយបើកម្ដងទៀត"); }
  if (!INIT) { ui("off"); return alertMsg(ERR.open_from_telegram); }
  const gen = ++S.gen; await disconnect(true);
  S.mode = peer ? "private" : "group"; S.peer = peer || null;
  if (peer) S.peerName = (S.members.find(m => m.id === peer) || {}).name || S.peerName || "Member";
  ui("connecting"); alertMsg("");
  let r; try { r = await api("/icom/token", peer ? { peer } : {}); } catch (e) { r = { ok: false, j: {} }; }
  if (gen !== S.gen) return;
  if (!r.ok) { ui("off"); return alertMsg((ERR[r.j.error] || "🌐 ភ្ជាប់ Server មិនបាន — ចុច Join ម្ដងទៀត") + " <small style='opacity:.7'>(" + (r.status || "net") + ")</small>"); }
  S.me = r.j.me; S.myName = r.j.name; S.myPhoto = r.j.photo; if (r.j.peerName) S.peerName = r.j.peerName;
  const room = new LK.Room({ adaptiveStream: true, dynacast: true,
    audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  S.room = room;
  const re = () => render();
  room.on(LK.RoomEvent.TrackSubscribed, t => { if (t.kind === "audio") { const el = t.attach(); el.setAttribute("playsinline", ""); el.hidden = true; document.body.appendChild(el); } })
    .on(LK.RoomEvent.TrackUnsubscribed, t => t.detach().forEach(el => el.remove()))
    .on(LK.RoomEvent.ParticipantConnected, p => { re(); if (S.mode === "private" && idOf(p) === S.peer) { blip(true); haptic("medium"); } })
    .on(LK.RoomEvent.ParticipantDisconnected, re).on(LK.RoomEvent.ActiveSpeakersChanged, re)
    .on(LK.RoomEvent.TrackMuted, re).on(LK.RoomEvent.TrackUnmuted, re).on(LK.RoomEvent.TrackPublished, re)
    .on(LK.RoomEvent.Reconnecting, () => ui("reconnecting")).on(LK.RoomEvent.Reconnected, () => ui("on"))
    .on(LK.RoomEvent.AudioPlaybackStatusChanged, () => { $("tapsound").style.display = room.canPlaybackAudio ? "none" : "flex"; })
    .on(LK.RoomEvent.DataReceived, (payload, from) => { try { const m = JSON.parse(new TextDecoder().decode(payload));
      if (m.t === "ring" && S.mode === "group") showRing(idOf(from) || m.from, m.name || (from && from.name)); } catch (e) {} })
    .on(LK.RoomEvent.Disconnected, () => { if (S.room === room) { S.room = null; S.mic = null; S.talking = false; ui("off"); render(); } });
  try { await room.connect(r.j.url, r.j.token); }
  catch (e) { if (S.room === room) S.room = null; ui("off");
    return alertMsg("📡 ចូល Voice មិនបាន — ពិនិត្យ Internet ហើយចុច Join ម្ដងទៀត<br><small style='opacity:.7'>" + esc((e && e.message) || e).slice(0, 160) + "</small>"); }
  if (gen !== S.gen) { room.disconnect(); return; }
  try { await room.startAudio(); } catch (e) {}
  $("tapsound").style.display = room.canPlaybackAudio ? "none" : "flex";
  ui("on"); render(); haptic("medium");
  ensureMic().catch(() => {});      // asks for the microphone now, so the first tap talks right away
  try { navigator.wakeLock && navigator.wakeLock.request("screen"); } catch (e) {}
}
async function disconnect(quiet) {
  const room = S.room; S.room = null; S.mic = null; S.talking = false;
  if (room) { try { await room.disconnect(); } catch (e) {} }
  if (!quiet) { ui("off"); render(); }
}

async function call(peer) {      // tap a member → ring them, then open the private room
  const m = S.members.find(x => x.id === peer); if (!m) return;
  haptic("medium"); S.peerName = m.name;
  const online = onlineIds().has(peer);
  if (online && S.room) {
    try { await S.room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify({ t: "ring", from: S.me, name: S.myName })),
      { reliable: true, destinationIdentities: ["tg" + peer] }); } catch (e) {}
  } else {
    api("/icom/ring", { peer }).then(r => { if (!r.ok && r.j.error && r.j.error !== "wait") alertMsg(ERR[r.j.error] || "ហៅតាម Telegram មិនបាន"); }).catch(() => {});
  }
  connect(peer);
}
function showRing(from, name) {
  if (!from || from === S.me) return;
  S.ringFrom = { id: from, name: name || "Member" };
  $("ringTx").innerHTML = `📻 <b>${esc(S.ringFrom.name)}</b> កំពុងហៅអ្នក<br>Private ICOM`;
  $("ring").style.display = "flex"; blip(true); setTimeout(() => blip(false), 180); haptic("heavy");
  clearTimeout(showRing.t); showRing.t = setTimeout(() => { $("ring").style.display = "none"; }, 30000);
}

async function loadMembers() {
  try { const r = await api("/icom/members"); if (r.ok) { S.members = r.j.members || []; S.me = r.j.me; renderMembers(); } } catch (e) {}
}

// ---------- events ----------
$("talk").addEventListener("click", () => setTalk(!S.talking));
$("talk").addEventListener("contextmenu", e => e.preventDefault());
$("joinBtn").addEventListener("click", () => S.state === "on" ? disconnect() : connect(S.mode === "private" ? S.peer : null));
$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return;
  S.tab = b.dataset.tab; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  haptic("light"); if (S.tab === "members") loadMembers(); ui(S.state || "off"); render(); });
$("mlist").addEventListener("click", e => { const b = e.target.closest("[data-call]") || e.target.closest("li[data-id]");
  if (b) call(+(b.dataset.call || b.dataset.id)); });
$("search").addEventListener("input", renderMembers);
$("toGroup").addEventListener("click", () => { haptic("light"); connect(null); });
$("ringYes").addEventListener("click", () => { $("ring").style.display = "none"; if (S.ringFrom) { S.peerName = S.ringFrom.name; connect(S.ringFrom.id); } });
$("ringNo").addEventListener("click", () => { $("ring").style.display = "none"; });
$("tapsound").addEventListener("click", async () => { try { await S.room.startAudio(); } catch (e) {} $("tapsound").style.display = "none"; });
$("back").addEventListener("click", () => { disconnect(true); if (history.length > 1) history.back(); else if (tg) tg.close(); });
if (tg) { tg.BackButton.show(); tg.BackButton.onClick(() => $("back").click()); }
window.addEventListener("pagehide", () => disconnect(true));

// Auto-join: group by default, or the private room from a "📻 ... is calling" button (?with=<id>)
ui("off");
loadMembers().then(() => connect(WITH || null));
})();
</script>
</body>
</html>
